name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase stub for public-route E2E
        run: |
          python3 -m http.server 54321 --bind 127.0.0.1 >/tmp/examsaarthi-supabase-stub.log 2>&1 &
      - name: Run full Playwright test gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: playwright-test-key
        run: npm test
      - name: Run command parser unit gate
        run: node --test src/lib/voice/__tests__/commandParser.test.ts
      - name: Run voice credential unit gate
        run: npx tsx --test src/lib/auth/__tests__/voiceCredentials.test.ts
      - name: Run i18n dictionary unit gate
        run: npx tsx --test src/lib/i18n/__tests__/registry.test.ts
      - name: Run data verification gate
        run: npm run verify:data
      - name: Run practice feedback unit gate
        run: npx tsx --test src/lib/practice/__tests__/feedback.test.ts
