<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Star network</title><desc id="desc">A central switch connected to five workstations.</desc><g stroke="black" stroke-width="5"><line x1="360" y1="260" x2="140" y2="100"/><line x1="360" y1="260" x2="580" y2="100"/><line x1="360" y1="260" x2="100" y2="400"/><line x1="360" y1="260" x2="620" y2="400"/><line x1="360" y1="260" x2="360" y2="80"/></g><g font-family="sans-serif" font-size="28" text-anchor="middle"><rect x="270" y="220" width="180" height="80" fill="none" stroke="black" stroke-width="6"/><text x="360" y="268">Switch</text><circle cx="140" cy="100" r="45" fill="white" stroke="black" stroke-width="6"/><text x="140" y="110">A</text><circle cx="580" cy="100" r="45" fill="white" stroke="black" stroke-width="6"/><text x="580" y="110">B</text><circle cx="100" cy="400" r="45" fill="white" stroke="black" stroke-width="6"/><text x="100" y="410">C</text><circle cx="620" cy="400" r="45" fill="white" stroke="black" stroke-width="6"/><text x="620" y="410">D</text><circle cx="360" cy="80" r="45" fill="white" stroke="black" stroke-width="6"/><text x="360" y="90">E</text></g></svg>