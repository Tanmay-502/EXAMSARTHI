<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="title desc"><title id="title">Triangle angles</title><desc id="desc">A triangle with two angles labelled 50 degrees and 60 degrees.</desc><polygon points="300,70 110,360 500,360" fill="none" stroke="black" stroke-width="6"/><text x="185" y="330" font-size="30" font-family="sans-serif">50°</text><text x="420" y="330" font-size="30" font-family="sans-serif">60°</text></svg>