<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="title desc"><title id="title">Direction route</title><desc id="desc">A route from a start point goes 5 kilometres north and then 3 kilometres east.</desc><path d="M130 330 L130 130 L310 130" fill="none" stroke="black" stroke-width="8"/><circle cx="130" cy="330" r="12" fill="black"/><text x="130" y="365" text-anchor="middle" font-size="26" font-family="sans-serif">Start</text><polygon points="130,110 117,140 143,140" fill="black"/><text x="145" y="225" font-size="26" font-family="sans-serif">5 km north</text><polygon points="330,130 300,117 300,143" fill="black"/><text x="215" y="110" font-size="26" font-family="sans-serif">3 km east</text></svg>