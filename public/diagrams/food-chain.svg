<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title desc"><title id="title">Food chain</title><desc id="desc">Grass, grasshopper, frog and snake connected in a food chain.</desc><g font-family="sans-serif" font-size="28" text-anchor="middle"><rect x="20" y="75" width="160" height="60" fill="none" stroke="black" stroke-width="5"/><rect x="220" y="75" width="160" height="60" fill="none" stroke="black" stroke-width="5"/><rect x="420" y="75" width="160" height="60" fill="none" stroke="black" stroke-width="5"/><rect x="620" y="75" width="160" height="60" fill="none" stroke="black" stroke-width="5"/><text x="100" y="113">Grass</text><text x="300" y="113">Grasshopper</text><text x="500" y="113">Frog</text><text x="700" y="113">Snake</text></g><g stroke="black" stroke-width="5" fill="black"><line x1="180" y1="105" x2="220" y2="105"/><polygon points="220,105 205,96 205,114"/><line x1="380" y1="105" x2="420" y2="105"/><polygon points="420,105 405,96 405,114"/><line x1="580" y1="105" x2="620" y2="105"/><polygon points="620,105 605,96 605,114"/></g></svg>